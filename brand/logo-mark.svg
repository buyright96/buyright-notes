<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BuyRight Notes mark">
  <title>BuyRight Notes</title>
  <!-- The note: a rounded card with a folded top-right corner -->
  <path d="M22 8H40L56 24V42a14 14 0 0 1-14 14H22A14 14 0 0 1 8 42V22A14 14 0 0 1 22 8Z" fill="#27201b" stroke="#f0a458" stroke-opacity="0.55" stroke-width="2"/>
  <!-- The fold -->
  <path d="M40 8v10a6 6 0 0 0 6 6h10Z" fill="#c9782e"/>
  <!-- The check: one stroke, exits toward the fold -->
  <path d="M19 34l11 11 23-25" fill="none" stroke="#ffc68a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
