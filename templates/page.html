<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--META-->
<link rel="icon" href="{{ROOT}}brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..600,0..100;1,9..144,400,0..100&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}brand/brand.css">
<link rel="stylesheet" href="{{ROOT}}storefront.css">
<style>
  .prose { max-width: 680px; margin: 0 auto; padding: var(--sp-6) var(--gutter) var(--sp-8); display: grid; gap: var(--sp-4); font-size: var(--fs-md); line-height: var(--lh-body); }
  .prose h1 { font-size: var(--fs-2xl); }
  .prose h2 { font-size: var(--fs-xl); margin-top: var(--sp-4); }
  .prose p, .prose li { color: var(--text-2); }
  .prose a { color: var(--text); }
  .prose ul, .prose ol { padding-left: 1.2em; margin: 0; display: grid; gap: 6px; }
  .prose .updated { font-size: var(--fs-xs); color: var(--text-3); }
  .prose .byline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-sm); color: var(--text-3); }
  .prose .byline b { color: var(--text-2); font-weight: 600; }
  .prose .disclosure { margin: 0; }
  .prose h3 { font-size: var(--fs-lg); margin-top: var(--sp-2); }
  .prose .backlink { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-sm); color: var(--text-2); text-decoration: none; min-height: 44px; }
  .prose .backlink:hover { color: var(--text); }
  .collection { display: grid; gap: var(--sp-3); margin: 0; padding: 0; list-style: none; }
  .collection li { display: grid; gap: 4px; padding: var(--sp-4); border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .collection a { display: block; padding: 6px 0; min-height: 44px; font: 600 var(--fs-lg)/1.25 var(--font-display); color: var(--text); text-decoration: none; }
  .collection a:hover { color: var(--accent-hi); }
  .collection p { margin: 0; font-size: var(--fs-sm); }
  .collection small { font-size: var(--fs-xs); color: var(--text-3); }
  .prose blockquote { margin: 0; padding: var(--sp-3) var(--sp-4); border-left: 2px solid var(--clay); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--blush); font-size: var(--fs-sm); }
</style>
<!--ANALYTICS-->
</head>
<body class="grain">
<div class="lampfield" aria-hidden="true"></div>
<div class="page">
{{HEADER}}  <main class="prose">
{{CONTENT}}
  </main>
{{FOOTER}}</div>
</body>
</html>
